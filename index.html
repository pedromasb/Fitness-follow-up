<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Move · Diario de ejercicio</title>
  <meta name="description" content="Seguimiento diario de tu ejercicio" />
  <meta name="theme-color" content="#FBF8F4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1A20" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Move" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #FBF8F4;
      --card: #FFFFFF;
      --text: #2E2A33;
      --muted: #8E8798;
      --line: #EFEAE4;
      --empty: #F1ECE6;
      --shadow: 0 1px 2px rgba(46, 42, 51, .04), 0 8px 24px rgba(46, 42, 51, .06);

      --futbol: #A8E2BF;
      --gym: #CBB6F2;
      --padel: #FFC9A0;
      --otro: #A9D6F2;
      --futbol-ink: #2F7A52;
      --gym-ink: #6A4BB0;
      --padel-ink: #B0602A;
      --otro-ink: #2E6E96;

      --accent: #F6B5C8;
      --accent-ink: #A23E62;
      --radius: 22px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1A20;
        --card: #26232B;
        --text: #F2EEF6;
        --muted: #A39CAD;
        --line: #35313B;
        --empty: #312D37;
        --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
        --futbol-ink: #A8E2BF;
        --gym-ink: #CBB6F2;
        --padel-ink: #FFC9A0;
        --otro-ink: #A9D6F2;
        --accent-ink: #F6B5C8;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

    header { padding: 24px 4px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    header .hello { font-size: 14px; color: var(--muted); margin: 0 0 2px; }
    header h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0; font-weight: 750; }
    .streak {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #5A2238;
      padding: 8px 14px; border-radius: 999px; font-weight: 650; font-size: 14px; white-space: nowrap;
    }

    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px; margin-bottom: 16px;
    }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; font-weight: 650; }

    /* Day editor */
    .daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .daynav .label { text-align: center; }
    .daynav .label strong { display: block; font-size: 20px; letter-spacing: -0.01em; text-transform: capitalize; }
    .daynav .label span { font-size: 13px; color: var(--muted); }
    .iconbtn {
      width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--empty); color: var(--text);
      font-size: 20px; display: grid; place-items: center; cursor: pointer; transition: transform .15s;
    }
    .iconbtn:active { transform: scale(.92); }
    .iconbtn:disabled { opacity: .35; }

    .types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .type {
      position: relative; border: 2px solid transparent; border-radius: 18px; padding: 16px 14px;
      background: var(--empty); color: var(--text); font: inherit; text-align: left; cursor: pointer;
      display: flex; align-items: center; gap: 12px; transition: transform .15s, background .2s, border-color .2s;
    }
    .type:active { transform: scale(.97); }
    .type .emoji { font-size: 26px; line-height: 1; }
    .type .name { font-weight: 650; font-size: 16px; }
    .type .check {
      position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%;
      background: rgba(255,255,255,.7); display: grid; place-items: center; font-size: 12px; opacity: 0; transform: scale(.6);
      transition: opacity .2s, transform .2s; color: #2E2A33;
    }
    .type.on .check { opacity: 1; transform: scale(1); }
    .type[data-type="futbol"].on { background: var(--futbol); color: #1F3D2C; }
    .type[data-type="gym"].on { background: var(--gym); color: #33255A; }
    .type[data-type="padel"].on { background: var(--padel); color: #5A3014; }
    .type[data-type="otro"].on { background: var(--otro); color: #183B52; }

    .field { margin-top: 12px; }
    .field input, .field textarea {
      width: 100%; border: 2px solid var(--line); background: transparent; color: var(--text);
      border-radius: 16px; padding: 12px 14px; font: inherit; outline: none; transition: border-color .2s;
    }
    .field textarea { min-height: 96px; resize: vertical; }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
    .hidden { display: none !important; }

    .rowend { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; min-height: 22px; }
    .saved { font-size: 13px; color: var(--muted); opacity: 0; transition: opacity .3s; }
    .saved.show { opacity: 1; }
    .linkbtn { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

    /* Heatmap */
    .heat-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .heat-head h2 { margin: 0; }
    .heat-head .count { font-size: 13px; color: var(--muted); }
    .heat-scroll { overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px 4px; }
    .heat-scroll::-webkit-scrollbar { display: none; }
    .heat { display: grid; grid-template-columns: 22px auto; gap: 4px; width: max-content; }
    .months { grid-column: 2; display: grid; grid-auto-flow: column; grid-auto-columns: 14px; column-gap: 3px; font-size: 10px; color: var(--muted); height: 14px; }
    .months span { white-space: nowrap; overflow: visible; }
    .wdays { display: grid; grid-template-rows: repeat(7, 14px); row-gap: 3px; font-size: 9px; color: var(--muted); }
    .wdays span { line-height: 14px; }
    .grid { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; }
    .cell {
      width: 14px; height: 14px; border-radius: 4px; background: var(--empty); border: none; padding: 0; cursor: pointer;
    }
    .cell.future { opacity: 0; pointer-events: none; }
    .cell.today { box-shadow: 0 0 0 1.5px var(--muted); }
    .cell.sel { box-shadow: 0 0 0 2px var(--text); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { background: var(--empty); border-radius: 16px; padding: 14px 12px; }
    .stat b { display: block; font-size: 26px; letter-spacing: -0.02em; font-weight: 750; }
    .stat span { font-size: 12px; color: var(--muted); }
    .bars { margin-top: 16px; display: grid; gap: 10px; }
    .bar { display: grid; grid-template-columns: 82px 1fr 34px; align-items: center; gap: 10px; font-size: 14px; }
    .bar .track { height: 10px; background: var(--empty); border-radius: 99px; overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 99px; transition: width .5s ease; }
    .bar .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Recent */
    .list { display: grid; gap: 4px; }
    .item { display: flex; gap: 12px; padding: 10px 6px; border-radius: 14px; cursor: pointer; align-items: flex-start; }
    .item:active { background: var(--empty); }
    .item .date { min-width: 46px; text-align: center; }
    .item .date b { display: block; font-size: 20px; line-height: 1.1; }
    .item .date span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .item .body { flex: 1; min-width: 0; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 99px; }
    .pill.futbol { background: var(--futbol); color: #1F3D2C; }
    .pill.gym { background: var(--gym); color: #33255A; }
    .pill.padel { background: var(--padel); color: #5A3014; }
    .pill.otro { background: var(--otro); color: #183B52; }
    .item .note { font-size: 14px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty-msg { color: var(--muted); font-size: 14px; text-align: center; padding: 12px 0; }

    footer { display: flex; justify-content: center; gap: 20px; padding: 8px 0 16px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 20px);
      background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px;
      opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="hello" id="hello">Hola 👋</p>
        <h1>Tu movimiento</h1>
      </div>
      <div class="streak" id="streak">🔥 0 días</div>
    </header>

    <section class="card" id="editor">
      <div class="daynav">
        <button class="iconbtn" id="prev" aria-label="Día anterior">‹</button>
        <div class="label">
          <strong id="dayTitle">Hoy</strong>
          <span id="daySub"></span>
        </div>
        <button class="iconbtn" id="next" aria-label="Día siguiente">›</button>
      </div>

      <div class="types" id="types">
        <button class="type" data-type="futbol"><span class="emoji">⚽</span><span class="name">Fútbol</span><span class="check">✓</span></button>
        <button class="type" data-type="gym"><span class="emoji">🏋️</span><span class="name">Gym</span><span class="check">✓</span></button>
        <button class="type" data-type="padel"><span class="emoji">🎾</span><span class="name">Pádel</span><span class="check">✓</span></button>
        <button class="type" data-type="otro"><span class="emoji">✨</span><span class="name">Otro</span><span class="check">✓</span></button>
      </div>

      <div class="field hidden" id="otherWrap">
        <input id="other" type="text" placeholder="¿Qué has hecho? (yoga, correr, natación…)" maxlength="40" />
      </div>
      <div class="field">
        <textarea id="note" placeholder="Notas: cómo te has sentido, pesos, resultado del partido…"></textarea>
      </div>
      <div class="rowend">
        <span class="saved" id="saved">Guardado ✓</span>
        <button class="linkbtn" id="clearDay">Borrar día</button>
      </div>
    </section>

    <section class="card">
      <div class="heat-head">
        <h2>Historial</h2>
        <span class="count" id="yearCount"></span>
      </div>
      <div class="heat-scroll" id="heatScroll">
        <div class="heat">
          <div class="months" id="months"></div>
          <div class="wdays"><span>L</span><span></span><span>X</span><span></span><span>V</span><span></span><span>D</span></div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
      <div class="legend">
        <span><i style="background:var(--futbol)"></i>Fútbol</span>
        <span><i style="background:var(--gym)"></i>Gym</span>
        <span><i style="background:var(--padel)"></i>Pádel</span>
        <span><i style="background:var(--otro)"></i>Otro</span>
      </div>
    </section>

    <section class="card">
      <h2>Resumen</h2>
      <div class="stats">
        <div class="stat"><b id="sWeek">0</b><span>esta semana</span></div>
        <div class="stat"><b id="sMonth">0</b><span>este mes</span></div>
        <div class="stat"><b id="sBest">0</b><span>mejor racha</span></div>
      </div>
      <div class="bars" id="bars"></div>
    </section>

    <section class="card">
      <h2>Últimos entrenamientos</h2>
      <div class="list" id="recent"></div>
    </section>

    <footer>
      <button class="linkbtn" id="exportBtn">Exportar copia</button>
      <button class="linkbtn" id="importBtn">Importar copia</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden" />
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    const KEY = 'move.entries.v1';
    const TYPES = {
      futbol: { name: 'Fútbol', emoji: '⚽', color: 'var(--futbol)' },
      gym:    { name: 'Gym',    emoji: '🏋️', color: 'var(--gym)' },
      padel:  { name: 'Pádel',  emoji: '🎾', color: 'var(--padel)' },
      otro:   { name: 'Otro',   emoji: '✨', color: 'var(--otro)' },
    };
    const ORDER = ['futbol', 'gym', 'padel', 'otro'];
    const $ = (id) => document.getElementById(id);

    // ---------- storage ----------
    let data = {};
    try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { data = {}; }
    const persist = () => {
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
    };
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    // ---------- dates (local) ----------
    const pad = (n) => String(n).padStart(2, '0');
    const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
    const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
    const fmtLong = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    const fmtMonth = new Intl.DateTimeFormat('es-ES', { month: 'short' });
    const fmtWd = new Intl.DateTimeFormat('es-ES', { weekday: 'short' });
    const isActive = (k) => !!(data[k] && data[k].types && data[k].types.length);

    let selected = keyOf(today());

    // ---------- editor ----------
    function renderEditor() {
      const t = keyOf(today());
      const d = fromKey(selected);
      const diff = Math.round((today() - d) / 86400000);
      $('dayTitle').textContent = diff === 0 ? 'Hoy' : diff === 1 ? 'Ayer' : fmtLong.format(d).split(',')[0];
      $('daySub').textContent = fmtLong.format(d);
      $('next').disabled = selected >= t;

      const e = data[selected] || { types: [], note: '', other: '' };
      document.querySelectorAll('.type').forEach((b) => {
        b.classList.toggle('on', e.types.includes(b.dataset.type));
      });
      $('otherWrap').classList.toggle('hidden', !e.types.includes('otro'));
      $('other').value = e.other || '';
      $('note').value = e.note || '';
      $('clearDay').classList.toggle('hidden', !data[selected]);
    }

    let savedTimer;
    function flashSaved() {
      $('saved').classList.add('show');
      clearTimeout(savedTimer);
      savedTimer = setTimeout(() => $('saved').classList.remove('show'), 1400);
    }

    function update(mut) {
      const e = data[selected] || { types: [], note: '', other: '' };
      mut(e);
      if (!e.types.length && !e.note.trim()) delete data[selected];
      else data[selected] = e;
      persist();
      flashSaved();
      renderAll(false);
    }

    $('types').addEventListener('click', (ev) => {
      const b = ev.target.closest('.type');
      if (!b) return;
      const t = b.dataset.type;
      if (navigator.vibrate) navigator.vibrate(8);
      update((e) => {
        e.types = e.types.includes(t) ? e.types.filter((x) => x !== t) : ORDER.filter((x) => x === t || e.types.includes(x));
      });
      if (t === 'otro' && data[selected] && data[selected].types.includes('otro')) $('other').focus();
    });

    let typing;
    const onType = (field) => (ev) => {
      const v = ev.target.value;
      clearTimeout(typing);
      typing = setTimeout(() => update((e) => { e[field] = v; }), 350);
    };
    $('note').addEventListener('input', onType('note'));
    $('other').addEventListener('input', onType('other'));

    $('prev').addEventListener('click', () => { selected = keyOf(addDays(fromKey(selected), -1)); renderAll(true); });
    $('next').addEventListener('click', () => {
      const n = keyOf(addDays(fromKey(selected), 1));
      if (n <= keyOf(today())) { selected = n; renderAll(true); }
    });
    $('clearDay').addEventListener('click', () => {
      if (!confirm('¿Borrar el registro de este día?')) return;
      delete data[selected]; persist(); renderAll(true); toast('Día borrado');
    });

    // ---------- heatmap ----------
    function cellBg(types) {
      const cs = types.map((t) => TYPES[t].color);
      if (cs.length === 1) return cs[0];
      if (cs.length === 2) return `linear-gradient(135deg, ${cs[0]} 50%, ${cs[1]} 50%)`;
      const step = 360 / cs.length;
      return `conic-gradient(${cs.map((c, i) => `${c} ${i * step}deg ${(i + 1) * step}deg`).join(', ')})`;
    }

    function renderHeatmap(scroll) {
      const t = today();
      const end = addDays(mondayOf(t), 6);
      const start = addDays(mondayOf(t), -52 * 7);
      const grid = $('grid'), months = $('months');
      grid.innerHTML = ''; months.innerHTML = '';
      const frag = document.createDocumentFragment();
      const mfrag = document.createDocumentFragment();
      const tKey = keyOf(t);
      let lastMonth = -1, count = 0;
      for (let w = 0, d = new Date(start); d <= end; w++) {
        const m = document.createElement('span');
        // label a column with the month if the month starts in it
        for (let i = 0; i < 7; i++) {
          const dd = addDays(d, i);
          if (dd.getDate() === 1 && dd.getMonth() !== lastMonth) {
            m.textContent = fmtMonth.format(dd).replace('.', ''); lastMonth = dd.getMonth();
            break;
          }
        }
        mfrag.appendChild(m);
        for (let i = 0; i < 7; i++, d = addDays(d, 1)) {
          const k = keyOf(d);
          const c = document.createElement('button');
          c.className = 'cell';
          c.dataset.k = k;
          if (k > tKey) c.classList.add('future');
          if (k === tKey) c.classList.add('today');
          if (k === selected) c.classList.add('sel');
          if (isActive(k)) {
            c.style.background = cellBg(data[k].types);
            if (k >= keyOf(addDays(t, -364))) count++;
          }
          c.title = fmtLong.format(d);
          c.setAttribute('aria-label', fmtLong.format(d) + (isActive(k) ? ': ' + data[k].types.map((x) => TYPES[x].name).join(', ') : ''));
          frag.appendChild(c);
        }
      }
      grid.appendChild(frag); months.appendChild(mfrag);
      $('yearCount').textContent = `${count} días en el último año`;
      if (scroll) {
        const sc = $('heatScroll');
        requestAnimationFrame(() => { sc.scrollLeft = sc.scrollWidth; });
      }
    }

    $('grid').addEventListener('click', (ev) => {
      const c = ev.target.closest('.cell');
      if (!c || c.classList.contains('future')) return;
      selected = c.dataset.k;
      renderAll(false);
      $('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // ---------- stats ----------
    function streaks() {
      const t = today();
      let cur = 0;
      let d = isActive(keyOf(t)) ? t : addDays(t, -1); // today not logged yet doesn't break the streak
      while (isActive(keyOf(d))) { cur++; d = addDays(d, -1); }
      const keys = Object.keys(data).filter(isActive).sort();
      let best = 0, run = 0, prev = null;
      for (const k of keys) {
        run = prev && keyOf(addDays(fromKey(prev), 1)) === k ? run + 1 : 1;
        best = Math.max(best, run); prev = k;
      }
      return { cur, best };
    }

    function renderStats() {
      const t = today();
      const { cur, best } = streaks();
      $('streak').textContent = `🔥 ${cur} ${cur === 1 ? 'día' : 'días'}`;
      const wk = keyOf(mondayOf(t));
      const mo = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-01`;
      const active = Object.keys(data).filter(isActive);
      $('sWeek').textContent = active.filter((k) => k >= wk).length;
      $('sMonth').textContent = active.filter((k) => k >= mo).length;
      $('sBest').textContent = best;

      const y0 = `${t.getFullYear()}-01-01`;
      const counts = Object.fromEntries(ORDER.map((x) => [x, 0]));
      active.filter((k) => k >= y0).forEach((k) => data[k].types.forEach((x) => counts[x]++));
      const max = Math.max(1, ...Object.values(counts));
      $('bars').innerHTML = ORDER.map((x) => `
        <div class="bar">
          <span>${TYPES[x].emoji} ${TYPES[x].name}</span>
          <div class="track"><div class="fill" style="width:${(counts[x] / max) * 100}%;background:${TYPES[x].color}"></div></div>
          <span class="n">${counts[x]}</span>
        </div>`).join('') + `<div style="font-size:12px;color:var(--muted)">Sesiones en ${t.getFullYear()}</div>`;
    }

    // ---------- recent ----------
    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function renderRecent() {
      const keys = Object.keys(data).sort().reverse().slice(0, 10);
      if (!keys.length) { $('recent').innerHTML = '<div class="empty-msg">Aún no hay entrenamientos. ¡Marca el de hoy! 💪</div>'; return; }
      $('recent').innerHTML = keys.map((k) => {
        const e = data[k], d = fromKey(k);
        const pills = (e.types || []).map((x) => `<span class="pill ${x}">${TYPES[x].emoji} ${x === 'otro' && e.other ? esc(e.other) : TYPES[x].name}</span>`).join('');
        return `<div class="item" data-k="${k}">
          <div class="date"><b>${d.getDate()}</b><span>${fmtMonth.format(d).replace('.', '')}</span></div>
          <div class="body"><div class="pills">${pills || '<span class="pill" style="background:var(--empty)">Descanso</span>'}</div>
          ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}</div></div>`;
      }).join('');
    }
    $('recent').addEventListener('click', (ev) => {
      const it = ev.target.closest('.item');
      if (!it) return;
      selected = it.dataset.k; renderAll(false);
      $('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // ---------- backup ----------
    $('exportBtn').addEventListener('click', async () => {
      const json = JSON.stringify({ app: 'move', version: 1, entries: data }, null, 2);
      const name = `move-backup-${keyOf(today())}.json`;
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Copia de Move' }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', async (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      try {
        const parsed = JSON.parse(await f.text());
        const entries = parsed.entries || parsed;
        let n = 0;
        for (const [k, e] of Object.entries(entries)) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !e || !Array.isArray(e.types)) continue;
          data[k] = { types: e.types.filter((x) => TYPES[x]), note: String(e.note || ''), other: String(e.other || '') };
          n++;
        }
        persist(); renderAll(true); toast(`${n} días importados`);
      } catch { toast('Archivo no válido'); }
      ev.target.value = '';
    });

    // ---------- misc ----------
    let toastTimer;
    function toast(msg) {
      const el = $('toast'); el.textContent = msg; el.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    function greet() {
      const h = new Date().getHours();
      $('hello').textContent = h < 6 ? 'Buenas noches 🌙' : h < 13 ? 'Buenos días ☀️' : h < 21 ? 'Buenas tardes 👋' : 'Buenas noches 🌙';
    }

    function renderAll(scroll) {
      greet(); renderEditor(); renderHeatmap(scroll); renderStats(); renderRecent();
    }

    // refresh when coming back to the app on a new day
    let lastDay = keyOf(today());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      const now = keyOf(today());
      if (now !== lastDay) { if (selected === lastDay) selected = now; lastDay = now; }
      renderAll(true);
    });

    renderAll(true);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  })();
  </script>
</body>
</html>
